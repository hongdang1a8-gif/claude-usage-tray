name: Release

# Push một tag dạng v1.2.3 để tạo bản release kèm file zip cài đặt
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p dist
          zip -r "dist/ClaudeUsageTray-${GITHUB_REF_NAME}.zip" \
            ClaudeUsageTray.ps1 start.vbs \
            install.ps1 install.cmd uninstall.ps1 uninstall.cmd \
            README.md docs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Claude Usage Tray $GITHUB_REF_NAME" \
            --generate-notes
