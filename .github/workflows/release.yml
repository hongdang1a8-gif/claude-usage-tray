name: Build

# - Mỗi lần push: build ClaudeUsageTray.exe và đính kèm vào trang Actions (mục Artifacts).
# - Push một tag dạng v1.2.3: build và tạo bản release kèm file exe.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build exe
        run: |
          # Bản release lấy số phiên bản từ tag (v2.0.1 -> 2.0.1), còn lại dùng <Version> trong csproj
          EXTRA=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then EXTRA=(-p:Version="${GITHUB_REF_NAME#v}"); fi
          dotnet build src/ClaudeUsageTray.csproj -c Release -o build "${EXTRA[@]}"
          mkdir -p dist
          cp build/ClaudeUsageTray.exe dist/

      # Gói zip này chỉ để bản PowerShell cũ (v1.2.x) tự cập nhật sang bản exe
      - name: Build zip for v1.x auto-update
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p pkg
          cp build/ClaudeUsageTray.exe packaging/install.ps1 pkg/
          (cd pkg && zip -r "../dist/ClaudeUsageTray-${GITHUB_REF_NAME}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageTray
          path: dist/ClaudeUsageTray.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ClaudeUsageTray.exe dist/*.zip \
            --title "Claude Usage Tray $GITHUB_REF_NAME" \
            --generate-notes
